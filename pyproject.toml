[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go-cfd-ingetrazo"
version = "0.2.0.dev0"
description = "Preliminary OpenFOAM wind engineering extension for IngeTrazo"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{name = "GO Engineering"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["go_cfd*"]

[tool.setuptools.package-data]
go_cfd = ["assets/*.svg"]
